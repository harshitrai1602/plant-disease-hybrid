project: multivariate-plant-disease-hybrid
seed: 42
dataset:
  image_size: 224
  batch_size: 32
  num_classes: 42
  split_ratio: [0.70, 0.15, 0.15]
  image_size_list: [224, 224]
model:
  primary: efficientnet_b0
  comparison1: resnet50
  comparison2: mobilenet_v3_large
training:
  epochs: 20
  learning_rate: 0.0001
  optimizer: adam
  weight_decay: 0.0001
  scheduler: ReduceLROnPlateau
  patience: 3
augmentation:
  horizontal_flip: true
  rotation: 15
  brightness_contrast: true
features:
  color: true
  texture_glcm: true
  shape: true
  lbp: false
  use_pca: false
api:
  host: 0.0.0.0
  port: 8000


  
